<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100%;
            height: 0;
            background-image:url(./nature.jpg);
            visibility: hidden;
            transition: all 2s ease;
            background-size: cover;
        }
        
        .show{
            visibility: visible;
            height: 100vh;
        }
        .box *{
            visibility: inherit;
            transition: all 2s ease;
        }
    </style>
</head>
<body>
    <button id="btn" data-target-element="#container" data-toggle-class="show" onclick="toggleClass(event)">click here to toggle</button>
    <div class="box" id="container" data-add="show" ></div>
</body>
<script src="./script.js"></script>
</html>
